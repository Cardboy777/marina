name: generate-builds

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-23.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: marina.flatpak
          manifest-path: build/linux/io.github.marina.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: marina-linux
          path: marina.flatpak

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          path-type: inherit
          update: true

      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          architecture: x64

      - name: Install container dependencies
        run: |
          pacman -Syu --noconfirm
          pacman --noconfirm -S git zip mingw-w64-x86_64-toolchain mingw-w64-x86_64-glfw mingw-w64-x86_64-mesa

      - name: Download Dependencies
        run: go get

      - name: Generate Version Info
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest
          go generate

      - name: Build
        run: go build -v -o marina.exe -ldflags="-s -w -H=windowsgui -extldflags='-static' -X 'marina/constants.AppVersion=${{ github.runId }}'"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: marina-windows
          path: marina.exe

  build-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          architecture: x64

      - name: Download Dependencies
        run: go get

      - name: Build
        run: go build -v -ldflags="-s -w -X 'marina/constants.AppVersion=${{ github.runId }}'" -o marina

      - name: Create .app bundle
        run: |
          mkdir -p Marina.app/Contents/MacOS
          mkdir -p Marina.app/Contents/Resources
          mv marina Marina.app/Contents/MacOS/
          cp build/assets/marina.icns Marina.app/Contents/Resources/ || cp build/assets/marina.png Marina.app/Contents/Resources/marina.icns
          cp build/macos/Info.plist Marina.app/Contents/Info.plist
          sed -i '' "s/__BUNDLE_VERSION__/${{ github.runId }}/g" Marina.app/Contents/Info.plist

      - name: Create DMG
        run: |
          hdiutil create -volname Marina -srcfolder Marina.app -ov -format UDZO marina.dmg

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: marina-mac
          path: marina.dmg
